<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="common.css" />
<style>
  #bg { position: absolute; inset: 0; background: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 96px 96px; background-position: center; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.65) 100%); }
  #title { position: absolute; left: 72px; top: 60px; font-weight: 500; font-size: 20px; color: var(--muted); }
  #row { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .node { position: relative; width: 310px; height: 180px; border: 2px solid var(--land_edge); background: rgba(20,24,29,0.85); display: flex; flex-direction: column; justify-content: center; padding: 0 22px; box-sizing: border-box; }
  .node .lbl { font-weight: 600; font-size: 30px; color: var(--info); letter-spacing: 0.1em; }
  .node .det { margin-top: 12px; font-size: 21px; color: var(--muted); line-height: 1.3; }
  .node .idx { position: absolute; top: 14px; left: 22px; font-size: 16px; color: var(--muted); }
  .link { width: 64px; height: 2px; background: var(--land_edge); transform-origin: left center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="__DURATION__">
  <section id="scene" class="clip" data-start="0" data-duration="__DURATION__">
    <div id="bg"></div><div id="vignette"></div>
    <div id="title" class="caps"></div>
    <div id="row"></div>
  </section>
</div>
<script>
  const P = __PAYLOAD__;
  const D = P.duration;
  const root = document.getElementById('root');
  for (const [k, v] of Object.entries(P.colors)) root.style.setProperty(`--${k}`, v);
  document.getElementById('title').textContent = P.data.title || '';
  const row = document.getElementById('row');
  const steps = P.data.steps;
  const nodes = [];
  const links = [];
  steps.forEach((s, i) => {
    if (i) { const l = document.createElement('div'); l.className = 'link'; row.appendChild(l); links.push(l); }
    const n = document.createElement('div');
    n.className = 'node';
    n.style.width = `${Math.min(310, Math.floor((1680 - (steps.length - 1) * 64) / steps.length))}px`;
    n.innerHTML = `<div class="idx mono">${String(i + 1).padStart(2, '0')}</div><div class="lbl caps"></div><div class="det"></div>`;
    n.querySelector('.lbl').textContent = s.label;
    n.querySelector('.det').textContent = s.detail || '';
    row.appendChild(n);
    nodes.push(n);
  });
  const gap = Math.max(1.0, Math.min(5, (D - 2) / steps.length));
  const tl = gsap.timeline({ paused: true });
  steps.forEach((s, i) => {
    const at = 0.6 + i * gap;
    const color = P.colors[s.role] || P.colors.info;
    if (i) tl.fromTo(links[i - 1], { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'power1.inOut' }, at - 0.5);
    tl.fromTo(nodes[i], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, at)
      .to(nodes[i], { borderColor: color, duration: 0.4 }, at + 0.2);
    if (i) tl.to(nodes[i - 1], { borderColor: P.colors.land_edge, duration: 0.4 }, at + 0.2);
  });
  tl.to({}, { duration: 0 }, D);
  document.fonts.ready.then(() => { window.__timelines['main'] = tl; });
</script>
</body>
</html>
