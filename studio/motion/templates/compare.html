<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="common.css" />
<style>
  #bars { position: absolute; left: 150px; right: 170px; top: 300px; bottom: 150px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .bar { display: grid; grid-template-columns: 340px 1fr 260px; align-items: center; gap: 30px; }
  .bar .name { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; }
  .bar .track { position: relative; height: 34px; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left center; }
  .bar .val { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 40px; text-align: right; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="__DURATION__">
  <section id="scene" class="clip" data-start="0" data-duration="__DURATION__">
    <div class="chart-bg"></div><div class="chart-grid"></div>
    <div id="title" class="chart-title"></div><div id="sub" class="chart-sub"></div>
    <div id="bars"></div>
    <div id="source" class="chart-source"></div>
  </section>
</div>
<script>
  const P = __PAYLOAD__;
  const D = P.duration;
  const root = document.getElementById('root');
  for (const [k, v] of Object.entries(P.colors)) root.style.setProperty(`--${k}`, v);
  document.getElementById('title').textContent = P.data.title || '';
  document.getElementById('sub').textContent = P.data.unit || '';
  document.getElementById('source').textContent = P.data.source ? `Source: ${P.data.source}` : '';
  const items = P.data.items;
  const max = Math.max(...items.map((i) => Math.abs(i.value))) || 1;
  const fmt = (v) => (Math.abs(v) >= 100 ? Math.round(v).toLocaleString('en-US') : (Math.round(v * 10) / 10).toString());
  const counters = [];
  const fills = [];
  const holder = document.getElementById('bars');
  items.forEach((it) => {
    const c = P.colors[it.role] || P.colors.info;
    const b = document.createElement('div');
    b.className = 'bar';
    b.innerHTML = '<div class="name"></div><div class="track"><div class="fill"></div></div><div class="val"></div>';
    b.querySelector('.name').textContent = it.label;
    const fill = b.querySelector('.fill');
    fill.style.background = c;
    fill.style.boxShadow = `0 0 22px ${c}66`;
    fill.style.width = `${(Math.abs(it.value) / max) * 100}%`;
    b.querySelector('.val').style.color = c;
    holder.appendChild(b);
    fills.push(fill);
    counters.push({ node: b.querySelector('.val'), v: 0, target: it.value });
  });
  const tl = gsap.timeline({ paused: true, onUpdate: () => counters.forEach((c) => { c.node.textContent = fmt(c.v); }) });
  tl.fromTo('#title', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.15)
    .fromTo('#sub', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.35)
    .fromTo('#source', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.6);
  const gap = Math.min(1.2, (D - 2.5) / items.length);
  items.forEach((it, i) => {
    const at = 0.7 + i * gap;
    tl.fromTo(fills[i], { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: 'power2.out' }, at)
      .to(counters[i], { v: it.value, duration: 1.2, ease: 'power2.out' }, at);
  });
  tl.to({}, { duration: 0 }, D);
  document.fonts.ready.then(() => { counters.forEach((c) => { c.node.textContent = fmt(0); }); window.__timelines['main'] = tl; });
</script>
</body>
</html>
