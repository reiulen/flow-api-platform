<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="vendor/gsap.min.js"></script>
<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/world.js"></script>
<link rel="stylesheet" href="common.css" />
<style>
  #bg { position: absolute; inset: 0; background: var(--water); }
  svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .land { fill: var(--land); stroke: var(--land_edge); stroke-width: 0.8; }
  .grat { fill: none; stroke: var(--grid); stroke-width: 0.6; }
  .lbl { font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.12em; fill: var(--info); paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
  #title { position: absolute; left: 72px; top: 60px; font-weight: 500; font-size: 20px; color: var(--muted); }
  #credit { position: absolute; right: 40px; bottom: 28px; font-size: 13px; color: var(--muted); opacity: 0.6; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="__DURATION__">
  <section id="scene" class="clip" data-start="0" data-duration="__DURATION__">
    <div id="bg"></div>
    <svg id="map" viewBox="0 0 1920 1080">
      <g id="g-grat"></g><g id="g-land"></g><g id="g-hl"></g><g id="g-rings"></g><g id="g-routes"></g><g id="g-points"></g><g id="g-labels"></g>
    </svg>
    <div id="title" class="caps"></div>
    <div id="credit" class="caps">Natural Earth</div>
  </section>
</div>
<script>
  const P = __PAYLOAD__;
  const D = P.duration;
  const C = P.colors;
  const root = document.getElementById('root');
  for (const [k, v] of Object.entries(C)) root.style.setProperty(`--${k}`, v);
  document.getElementById('title').textContent = P.data.title || '';

  const ALIAS = { 'United States': 'United States of America', USA: 'United States of America', US: 'United States of America', UK: 'United Kingdom', Britain: 'United Kingdom', 'Great Britain': 'United Kingdom', 'Republic of Korea': 'South Korea', DPRK: 'North Korea', 'Czech Republic': 'Czechia', UAE: 'United Arab Emirates' };
  const countries = topojson.feature(WORLD, WORLD.objects.countries).features;
  const byName = new Map(countries.map((f) => [f.properties.name.toLowerCase(), f]));
  const findCountry = (n) => byName.get((ALIAS[n] || n).toLowerCase());
  const BASE = 1920 / (2 * Math.PI);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, parent, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); parent.appendChild(e); return e; };
  const $ = (id) => document.getElementById(id);

  const cam = { lon: P.data.view.center[0], lat: P.data.view.center[1], scale: P.data.view.scale_from || 1 };
  const projection = d3.geoMercator().translate([960, 540]);
  const path = d3.geoPath(projection);
  const grat = el('path', $('g-grat'), { class: 'grat' });
  const graticule = d3.geoGraticule().step([10, 10])();
  const land = countries.map((f) => el('path', $('g-land'), { class: 'land' }));

  // Build step objects with their own animated state.
  const items = [];
  const steps = P.data.steps || [];
  const first = 0.9;
  const gap = Math.max(1.4, Math.min(6, (D - first - 1.6) / Math.max(1, steps.length)));
  const tl = gsap.timeline({ paused: true, onUpdate: draw });
  const firstIsZoom = steps[0]?.type === 'zoom';
  if (!firstIsZoom && (P.data.view.scale_to || 0) !== cam.scale) {
    tl.to(cam, { scale: P.data.view.scale_to, duration: Math.min(4, D * 0.4), ease: 'power2.inOut' }, 0);
  }

  steps.forEach((s, i) => {
    const at = first + i * gap;
    const color = C[s.role] || C.info;
    if (s.type === 'zoom') {
      tl.to(cam, { lon: s.center[0], lat: s.center[1], scale: s.scale, duration: Math.min(2.2, gap * 0.9), ease: 'power2.inOut' }, at);
    } else if (s.type === 'highlight') {
      for (const name of s.countries) {
        const f = findCountry(name);
        if (!f) continue;
        const it = { kind: 'hl', f, color, p: 0, node: el('path', $('g-hl'), { fill: color, stroke: color, 'stroke-width': 1.6 }) };
        items.push(it);
        tl.to(it, { p: 1, duration: 0.9, ease: 'power2.out' }, at);
      }
    } else if (s.type === 'route') {
      const legs = [s.from, ...(s.via || []), s.to];
      const pts = [];
      for (let k = 0; k < legs.length - 1; k++) {
        const interp = d3.geoInterpolate(legs[k], legs[k + 1]);
        const n = Math.max(8, Math.round(64 / (legs.length - 1)));
        for (let j = k ? 1 : 0; j <= n; j++) pts.push(interp(j / n));
      }
      const it = { kind: 'route', pts, color, p: 0, label: s.label, node: el('path', $('g-routes'), { fill: 'none', stroke: color, 'stroke-width': 3, 'stroke-linecap': 'round' }), head: el('path', $('g-routes'), { fill: color }) };
      items.push(it);
      tl.to(it, { p: 1, duration: Math.min(1.8, gap * 0.8), ease: 'power1.inOut' }, at);
    } else if (s.type === 'ring') {
      const circle = d3.geoCircle().center([s.lon, s.lat]).radius(s.radius_km / 111.195)();
      const it = { kind: 'ring', circle, color, p: 0, lon: s.lon, lat: s.lat, label: s.label, node: el('path', $('g-rings'), { fill: color, stroke: color, 'stroke-width': 2 }), dot: el('circle', $('g-rings'), { r: 5, fill: color }) };
      items.push(it);
      tl.to(it, { p: 1, duration: Math.min(1.6, gap * 0.8), ease: 'power2.out' }, at);
    } else if (s.type === 'point') {
      const it = { kind: 'point', lon: s.lon, lat: s.lat, color, p: 0, pulse: 0, label: s.label, dot: el('circle', $('g-points'), { r: 7, fill: color }), ring: el('circle', $('g-points'), { fill: 'none', stroke: color, 'stroke-width': 2 }) };
      items.push(it);
      tl.to(it, { p: 1, duration: 0.5, ease: 'power2.out' }, at).to(it, { pulse: 1, duration: 1.4, ease: 'power1.out' }, at + 0.1);
    }
  });
  for (const it of items) if (it.label) it.text = el('text', $('g-labels'), { class: 'lbl' });
  tl.to({}, { duration: 0 }, D);

  function draw() {
    projection.scale(BASE * cam.scale).center([cam.lon, cam.lat]);
    grat.setAttribute('d', path(graticule) || '');
    countries.forEach((f, i) => land[i].setAttribute('d', path(f) || ''));
    for (const it of items) {
      if (it.kind === 'hl') {
        it.node.setAttribute('d', path(it.f) || '');
        it.node.setAttribute('fill-opacity', 0.38 * it.p);
        it.node.setAttribute('stroke-opacity', it.p);
      } else if (it.kind === 'route') {
        const n = Math.max(2, Math.round(it.pts.length * it.p));
        const line = { type: 'LineString', coordinates: it.pts.slice(0, n) };
        it.node.setAttribute('d', it.p > 0 ? path(line) || '' : '');
        const tip = projection(it.pts[n - 1]);
        const prev = projection(it.pts[Math.max(0, n - 3)]);
        if (it.p > 0.05 && tip && prev) {
          const a = Math.atan2(tip[1] - prev[1], tip[0] - prev[0]);
          const s = 14;
          const pt = (r, da) => `${tip[0] + Math.cos(a + da) * r},${tip[1] + Math.sin(a + da) * r}`;
          it.head.setAttribute('d', `M${pt(s, 0)}L${pt(s, 2.5)}L${pt(s, -2.5)}Z`);
        } else it.head.setAttribute('d', '');
        if (it.text) placeLabel(it.text, projection(it.pts[Math.floor(it.pts.length / 2)]), it.p, [0, -18]);
      } else if (it.kind === 'ring') {
        it.node.setAttribute('d', path(it.circle) || '');
        it.node.setAttribute('fill-opacity', 0.12 * it.p);
        const len = it.node.getTotalLength ? it.node.getTotalLength() : 0;
        it.node.setAttribute('stroke-dasharray', `${len * it.p} ${len}`);
        const c = projection([it.lon, it.lat]);
        if (c) { it.dot.setAttribute('cx', c[0]); it.dot.setAttribute('cy', c[1]); it.dot.setAttribute('opacity', Math.min(1, it.p * 2)); }
        const topPt = projection([it.lon, it.lat + (it.circle.coordinates ? 0 : 0)]);
        const bounds = path.bounds(it.circle);
        if (it.text && topPt) placeLabel(it.text, [topPt[0], bounds[0][1] - 10], it.p, [0, 0], 'middle');
      } else if (it.kind === 'point') {
        const c = projection([it.lon, it.lat]);
        if (!c) continue;
        it.dot.setAttribute('cx', c[0]); it.dot.setAttribute('cy', c[1]); it.dot.setAttribute('opacity', it.p);
        it.ring.setAttribute('cx', c[0]); it.ring.setAttribute('cy', c[1]);
        it.ring.setAttribute('r', 7 + it.pulse * 26); it.ring.setAttribute('opacity', (1 - it.pulse) * 0.7 * it.p);
        if (it.text) placeLabel(it.text, c, it.p, [18, 8], 'start');
      }
    }
  }

  function placeLabel(node, xy, p, off, anchor = 'middle') {
    if (!xy) return;
    node.textContent = '';
    const label = (items.find((i) => i.text === node) || {}).label || '';
    node.textContent = label.toUpperCase();
    node.setAttribute('x', xy[0] + off[0]);
    node.setAttribute('y', xy[1] + off[1]);
    node.setAttribute('text-anchor', anchor);
    node.setAttribute('opacity', Math.max(0, (p - 0.4) / 0.6));
  }

  document.fonts.ready.then(() => { draw(); window.__timelines['main'] = tl; });
</script>
</body>
</html>
